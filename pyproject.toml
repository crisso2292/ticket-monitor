[project]
name = "ticket-monitor"
version = "0.1.0"
description = "FIFA World Cup ticket price monitor — StubHub + Gametime via Apify"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "apify-client>=1.8",
    "pydantic-settings>=2.0",
]

[project.scripts]
ticket-monitor = "ticket_monitor.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
